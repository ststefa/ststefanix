# Artifact Keeper: REPOSITORY durch deinen Repository-Key ersetzen.
# Private Repositories: Token über RCLONE_CONFIG_BIN_HEADERS setzen.
[bin.nom.cx]
type = http
url = https://bin.nom.cx/api/v1/repositories/REPOSITORY/download/
no_head = true

# Geplanter S3-kompatibler Dienst.
# Region gegebenenfalls an die spätere Serverkonfiguration anpassen.
# Credentials aus AWS-Profil "nom" oder AWS-Umgebungsvariablen.
[s3.nom.cx]
type = s3
provider = Other
endpoint = https://s3.nom.cx
#region = us-east-1
force_path_style = true
env_auth = true
profile = nom

# for testing
[local]
type = s3
provider = Other
endpoint = http://localhost:9000
#region = us-east-1
force_path_style = true
env_auth = true
profile = local